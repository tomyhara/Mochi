# cargo-deny configuration.
#
# NFR-4b.2: Apache-2.0 is incompatible with GPLv2 and can only be absorbed into
# GPLv3 one way, so no GPL-family dependency may enter the graph.
#
# NFR-3.9: advisories are checked in the same CI job.

[graph]
all-features = true
# Only the platforms Mochi ships to. Without this, cargo-deny reports every
# platform's dependencies at once, including the ones a windowing or graphics
# crate carries for platforms Mochi does not build for, and the bans below
# would fire on code that never reaches a user.
# scripts/check-no-network-deps.sh screens the same targets from the other
# direction.
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MIT-0",
  # An Apache-2.0 grant plus an extra permission, so strictly more permissive
  # than the plain Apache-2.0 already on this list.
  "Apache-2.0 WITH LLVM-exception",
  # The Boost licence: permissive, and unusually explicit that binary
  # distribution carries no attribution requirement at all. Reached through
  # clipboard-win, which is how the window copies a resume command on Windows.
  "BSL-1.0",
  # Fonts, not code: `epaint_default_fonts` carries the faces egui draws with
  # (Ubuntu Light under the Ubuntu font licence, Hack and Noto Emoji under the
  # SIL Open Font Licence). Both are permissive and both ask to be named, which
  # NOTICE does. Neither reaches Mochi's own source.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# NFR-3.1 / NFR-4b.8: Mochi is offline-only and ships no telemetry. These crates
# must not appear in the graph. scripts/check-no-network-deps.sh screens the
# same list from the other direction so a missing cargo-deny does not silently
# drop the guarantee.
deny = [
  # Two `windows` crates in one graph is not a duplicate, it is a build
  # failure: the Direct3D 12 types the window is drawn through exist once per
  # version, and a heap from one cannot be passed to a device from the other.
  # `gpu-allocator` accepts a range of versions so that it can be unified with
  # whatever its parent uses; nothing makes that unification happen, so this is
  # what notices when it has not. The fix is to pin the odd one out in
  # Cargo.lock, not to add an exception here.
  { crate = "windows", deny-multiple-versions = true },
  { crate = "windows-core", deny-multiple-versions = true },
  { crate = "reqwest", reason = "Mochi makes no network calls (NFR-3.1)" },
  { crate = "hyper", reason = "Mochi makes no network calls (NFR-3.1)" },
  { crate = "ureq", reason = "Mochi makes no network calls (NFR-3.1)" },
  { crate = "curl", reason = "Mochi makes no network calls (NFR-3.1)" },
  { crate = "sentry", reason = "Mochi ships no telemetry (NFR-4b.8)" },
  { crate = "opentelemetry", reason = "Mochi ships no telemetry (NFR-4b.8)" },
]

[advisories]
version = 2
yanked = "deny"
# NFR-3.9 asks for a vulnerability scan, and vulnerabilities stay denied.
#
# "Unmaintained" is a different thing: it is a note about a project's future,
# not a defect, and a transitive one is not ours to fix — a window sits on a
# wide graph of platform bindings, and a permanently red build only teaches
# everyone to ignore the job. Scoped to dependencies this workspace declares
# directly, where the report is something we can act on.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
