name: Release

# Builds the unsigned portable binary NFR-4b.7 asks for, so that people can use
# Mochi before code signing is funded (R-7), and attaches it to a draft release
# for a human to review and publish.
#
# One thing is built per platform, because there is only one thing: `mochi` is
# the window and the command line indexer in a single executable. Run with no
# arguments it opens the window; run with a subcommand it prints.
#
# Triggered by pushing a tag, or dispatched with one. The workflow file is read
# from the ref it runs on, so the build always matches the code being released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to, created if absent (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag and the version in Cargo.toml must agree, or `mochi --version`
  # reports something different from the release people downloaded.
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the workspace version $version" >&2
            exit 1
          fi
          echo "releasing $tag from workspace version $version"

  windows:
    name: windows-x86_64
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A release nobody tested is not a release.
      - name: Test
        run: cargo test --workspace --release --locked

      - name: Build
        run: cargo build --release --locked -p mochi-cli

      # One file. The licence notice travels inside it: `mochi licenses`.
      - name: Collect
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/mochi.exe "dist/Mochi-$version-windows-x86_64.exe"

          # A GUI-subsystem process is not waited for by `&`, so ask properly.
          # This is the only check that the file CI just built actually runs.
          $built = Start-Process -FilePath "dist/Mochi-$version-windows-x86_64.exe" `
            -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($built.ExitCode -ne 0) {
            throw "the built executable exited with $($built.ExitCode)"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macos-universal
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release --locked

      # NFR-4.1 covers both Apple Silicon and Intel, so ship one file that runs
      # on either rather than making people pick.
      - name: Build
        run: |
          cargo build --release --locked -p mochi-cli --target aarch64-apple-darwin
          cargo build --release --locked -p mochi-cli --target x86_64-apple-darwin

      - name: Collect
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          mkdir -p dist

          lipo -create -output "dist/Mochi-$version-macos-universal" \
            target/aarch64-apple-darwin/release/mochi \
            target/x86_64-apple-darwin/release/mochi
          chmod +x "dist/Mochi-$version-macos-universal"
          lipo -info "dist/Mochi-$version-macos-universal"
          "dist/Mochi-$version-macos-universal" --version
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: draft release
    needs: [check-version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # Nothing here is signed, so a checksum is the only way for someone
          # to tell that what they downloaded is what CI built.
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat > notes.md <<TXT
          Preview build of Mochi, from \`${{ github.sha }}\`.

          ## What this is

          Mochi collects the sessions Codex CLI, Claude Code and OpenCode leave
          on your machine, groups them by repository, and makes them readable
          and searchable. It works entirely offline: session files are never
          modified, and nothing is sent anywhere.

          **One file, nothing to install.** Download it, run it, and the window
          opens: your repositories on the left, the sessions of the one you pick
          beside them, the transcript in the middle, what each session is on the
          right. The same file is the
          command line tool — give it a subcommand (\`mochi sessions\`,
          \`mochi search ECONNRESET\`) and it prints instead. There is no
          installer, no web view and no runtime to install first; Mochi draws
          its own window.

          Credentials that end up in session logs are masked. Attribution for
          everything Mochi is built from travels inside the file:
          \`mochi licenses\`.

          ## What is not built yet

          - The window **reads**: no tags, notes, deleting or exporting from it.
          - **Resume shows you the command** rather than launching it. The
            integrated terminal is milestone 3.
          - Diffs are not extracted; file changes appear as the tool output that
            produced them.
          - OpenCode's newer SQLite storage is detected and reported, not read.

          ## Running it

          **Windows.** Double-click it. SmartScreen will warn, because nothing
          here is signed (R-7): choose *More info* then *Run anyway*, or check
          the file against \`SHA256SUMS.txt\` first.

          **macOS.** This is a Unix executable rather than an application
          bundle, so Finder will not launch it by double-clicking. From a
          terminal:

          \`\`\`sh
          chmod +x Mochi-${VERSION}-macos-universal
          xattr -d com.apple.quarantine Mochi-${VERSION}-macos-universal
          ./Mochi-${VERSION}-macos-universal
          \`\`\`

          Put it on your \`PATH\` as \`mochi\` and it is the command line
          tool as well.

          ## Files

          | File | For |
          | --- | --- |
          | \`Mochi-${VERSION}-windows-x86_64.exe\` | Windows 10/11, x86-64 |
          | \`Mochi-${VERSION}-macos-universal\` | macOS, Apple Silicon and Intel |
          | \`SHA256SUMS.txt\` | checksums for both |

          Linux is not a supported target (Q-6) and no Linux build is attached;
          \`cargo build --release -p mochi-cli\` works there.
          TXT

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail

          # A draft release has no tag in git until someone publishes it, so
          # the tags endpoint cannot find it. Match on the name it will take.
          find_release_id() {
            local ids
            ids="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                     --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
            printf '%s' "${ids%%$'\n'*}"
          }

          id="$(find_release_id)"

          if [ -n "$id" ]; then
            # Re-running replaces what the draft holds rather than adding to
            # it, so the release is always exactly one build. gh's --clobber
            # cannot do this: for a draft it sees no existing assets at all,
            # and GitHub compares asset names case insensitively, so a file
            # whose name changed only in case is rejected as a duplicate
            # instead of being replaced.
            for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
                             --paginate --jq '.[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
          else
            # --target pins the tag to the commit that was actually built.
            # When the tag does not exist yet, this creates it, which is how a
            # release can be cut without anyone holding tag-push rights.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft --title "Mochi $TAG (preview)" --notes-file notes.md dist/*
            id="$(find_release_id)"
          fi

          # An upload that half succeeded leaves a release whose files do not
          # match its own checksums, and nothing above would have failed. Say
          # so here instead of letting a human find out by downloading.
          attached="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
                        --paginate --jq '.[].name' | sort)"
          expected="$(cd dist && ls -1 | sort)"
          if [ "$attached" != "$expected" ]; then
            echo "::error::the draft's assets do not match what was built" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$attached") || true
            exit 1
          fi
          printf '%s\n' "$attached"
