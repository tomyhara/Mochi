name: Release

# Builds the unsigned portable binaries NFR-4b.7 asks for, so that people can
# use Mochi before code signing is funded (R-7), and attaches them to a draft
# release for a human to review and publish.
#
# Triggered by pushing a tag. The workflow file is read from the tag itself, so
# the build always matches the code being released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag and the version in Cargo.toml must agree, or `mochi --version`
  # reports something different from the release people downloaded.
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the workspace version $version" >&2
            exit 1
          fi
          echo "releasing $tag from workspace version $version"

  windows:
    name: windows-x86_64
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A release nobody tested is not a release.
      - name: Test
        run: cargo test --workspace --release --locked

      - name: Build
        run: cargo build --release --locked -p mochi-cli

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Path staging, dist | Out-Null
          Copy-Item target/release/mochi.exe staging/
          Copy-Item LICENSE, NOTICE, README.md staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/mochi-$version-windows-x86_64.zip"
          Copy-Item target/release/mochi.exe "dist/mochi-$version-windows-x86_64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macos-universal
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release --locked

      # NFR-4.1 covers both Apple Silicon and Intel, so ship one binary that
      # runs on either rather than making people pick.
      - name: Build both architectures
        run: |
          cargo build --release --locked -p mochi-cli --target aarch64-apple-darwin
          cargo build --release --locked -p mochi-cli --target x86_64-apple-darwin

      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          mkdir -p dist staging

          lipo -create -output staging/mochi \
            target/aarch64-apple-darwin/release/mochi \
            target/x86_64-apple-darwin/release/mochi
          chmod +x staging/mochi
          lipo -info staging/mochi

          cp LICENSE NOTICE README.md staging/
          cat > staging/INSTALL.txt <<'TXT'
          Mochi command line indexer
          ==========================

          This build is not signed or notarised (see SECURITY.md and R-7 in
          doc/requirements.md). macOS will refuse to run it until you clear the
          quarantine flag it attaches to downloaded files:

              xattr -d com.apple.quarantine ./mochi

          Then put it somewhere on your PATH, for example:

              sudo install -m 755 ./mochi /usr/local/bin/mochi
              mochi doctor

          Verify what you downloaded against SHA256SUMS.txt on the release page
          before doing any of this.
          TXT

          hdiutil create -volname "Mochi $version" -srcfolder staging \
            -ov -format UDZO "dist/mochi-$version-macos-universal.dmg"
          tar -czf "dist/mochi-$version-macos-universal.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: draft release
    needs: [check-version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # Nothing here is signed, so a checksum is the only way for someone
          # to tell that what they downloaded is what CI built.
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat > notes.md <<TXT
          Preview build of the Mochi command line indexer, from
          \`${{ github.sha }}\`.

          ## What this is

          \`mochi\` collects the sessions Codex CLI, Claude Code and OpenCode
          leave on your machine, groups them by repository, and makes them
          searchable. It reads only: session files are never modified, and
          nothing is sent anywhere.

              mochi doctor          # which CLIs and stores were found
              mochi scan            # build or refresh the index
              mochi repos
              mochi sessions
              mochi search ECONNRESET
              mochi resume 42       # prints the command; never runs it

          ## What this is not

          **There is no graphical application yet.** The desktop UI, the
          integrated terminal and the delete flow are not built. This is the
          milestone-1 core with a command line front end.

          ## These binaries are unsigned

          Code signing and notarisation are not funded yet (R-7), so:

          - **Windows** will show a SmartScreen warning. There is no
            certificate behind this build.
          - **macOS** will refuse to run it until you clear the quarantine
            flag: \`xattr -d com.apple.quarantine ./mochi\`

          Check what you downloaded against \`SHA256SUMS.txt\` first, or build
          from source — the instructions are in the README and need nothing
          beyond a Rust toolchain.

          ## Files

          | File | For |
          | --- | --- |
          | \`mochi-${VERSION}-windows-x86_64.exe\` | Windows, the binary on its own |
          | \`mochi-${VERSION}-windows-x86_64.zip\` | Windows, with LICENSE and NOTICE |
          | \`mochi-${VERSION}-macos-universal.dmg\` | macOS, Apple Silicon and Intel |
          | \`mochi-${VERSION}-macos-universal.tar.gz\` | macOS, same contents without the disk image |
          | \`SHA256SUMS.txt\` | checksums for all of the above |

          Linux is not a supported target (Q-6) and no Linux build is attached;
          \`cargo build --release\` works there.
          TXT

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Mochi $TAG (preview)" --notes-file notes.md dist/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
