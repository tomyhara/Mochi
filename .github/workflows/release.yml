name: Release

# Builds the unsigned portable binaries NFR-4b.7 asks for, so that people can
# use Mochi before code signing is funded (R-7), and attaches them to a draft
# release for a human to review and publish.
#
# Two things are built on each platform: the desktop application, and the
# command line indexer for people who would rather not have a window.
#
# Triggered by pushing a tag, or dispatched with one. The workflow file is read
# from the ref it runs on, so the build always matches the code being released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to, created if absent (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag and the version in Cargo.toml must agree, or the installer reports
  # something different from the release people downloaded. tauri.conf.json
  # deliberately has no version field: it takes the crate's.
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the workspace version $version" >&2
            exit 1
          fi
          if grep -q '"version"' crates/mochi-desktop/tauri.conf.json; then
            echo "::error::tauri.conf.json has its own version field; it should take the crate's" >&2
            exit 1
          fi
          echo "releasing $tag from workspace version $version"

  windows:
    name: windows-x86_64
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      # A release nobody tested is not a release.
      - name: Test
        run: cargo test --workspace --release --locked

      # Builds the interface and wraps it, producing the installers.
      - name: Build the application
        run: npx tauri build --config crates/mochi-desktop/tauri.conf.json

      - name: Build the command line indexer
        run: cargo build --release --locked -p mochi-cli

      - name: Collect
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Path staging, dist | Out-Null

          Get-ChildItem target/release/bundle/nsis/*-setup.exe |
            ForEach-Object { Copy-Item $_ "dist/Mochi-$version-windows-x86_64-setup.exe" }
          Get-ChildItem target/release/bundle/msi/*.msi |
            ForEach-Object { Copy-Item $_ "dist/Mochi-$version-windows-x86_64.msi" }

          Copy-Item target/release/mochi.exe staging/
          Copy-Item LICENSE, NOTICE, README.md staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/mochi-cli-$version-windows-x86_64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macos-universal
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: cargo test --workspace --release --locked

      # NFR-4.1 covers both Apple Silicon and Intel, so ship one build that
      # runs on either rather than making people pick.
      - name: Build the application
        run: npx tauri build --config crates/mochi-desktop/tauri.conf.json --target universal-apple-darwin

      - name: Build the command line indexer
        run: |
          cargo build --release --locked -p mochi-cli --target aarch64-apple-darwin
          cargo build --release --locked -p mochi-cli --target x86_64-apple-darwin

      - name: Collect
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          mkdir -p dist staging

          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "dist/Mochi-$version-macos-universal.dmg"

          lipo -create -output staging/mochi \
            target/aarch64-apple-darwin/release/mochi \
            target/x86_64-apple-darwin/release/mochi
          chmod +x staging/mochi
          lipo -info staging/mochi

          cp LICENSE NOTICE README.md staging/
          cat > staging/INSTALL.txt <<'TXT'
          Mochi command line indexer
          ==========================

          This build is not signed or notarised (see SECURITY.md and R-7 in
          doc/requirements.md). macOS will refuse to run it until you clear the
          quarantine flag it attaches to downloaded files:

              xattr -d com.apple.quarantine ./mochi

          Then put it somewhere on your PATH, for example:

              sudo install -m 755 ./mochi /usr/local/bin/mochi
              mochi doctor

          Verify what you downloaded against SHA256SUMS.txt on the release page
          before doing any of this.
          TXT

          tar -czf "dist/mochi-cli-$version-macos-universal.tar.gz" -C staging .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: draft release
    needs: [check-version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # Nothing here is signed, so a checksum is the only way for someone
          # to tell that what they downloaded is what CI built.
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat > notes.md <<TXT
          Preview build of Mochi, from \`${{ github.sha }}\`.

          ## What this is

          Mochi collects the sessions Codex CLI, Claude Code and OpenCode leave
          on your machine, groups them by repository, and makes them readable
          and searchable. It works entirely offline: session files are never
          modified, and nothing is sent anywhere.

          The window shows your repositories and their sessions on the left, the
          transcript in the middle, and what each session is on the right.
          Credentials that end up in session logs are masked.

          ## What is not built yet

          - The window **reads**: no tags, notes, deleting or exporting from it.
          - **Resume shows you the command** rather than launching it. The
            integrated terminal is milestone 3.
          - Diffs are not extracted; file changes appear as the tool output that
            produced them.
          - OpenCode's newer SQLite storage is detected and reported, not read.

          ## These builds are unsigned

          Code signing and notarisation are not funded yet (R-7), so:

          - **Windows** will show a SmartScreen warning. Choose *More info* then
            *Run anyway*, or check the file against \`SHA256SUMS.txt\` first.
          - **macOS** will refuse to open the app because it is quarantined.
            Either right-click the app and choose *Open*, or run:
            \`xattr -dr com.apple.quarantine /Applications/Mochi.app\`

          Building from source needs nothing but a Rust toolchain and Node; the
          instructions are in the README.

          ## Files

          | File | For |
          | --- | --- |
          | \`Mochi-${VERSION}-windows-x86_64-setup.exe\` | Windows, installer |
          | \`Mochi-${VERSION}-windows-x86_64.msi\` | Windows, for deployment tooling |
          | \`Mochi-${VERSION}-macos-universal.dmg\` | macOS, Apple Silicon and Intel |
          | \`mochi-cli-${VERSION}-windows-x86_64.zip\` | the command line indexer, Windows |
          | \`mochi-cli-${VERSION}-macos-universal.tar.gz\` | the command line indexer, macOS |
          | \`SHA256SUMS.txt\` | checksums for all of the above |

          Linux is not a supported target (Q-6) and no Linux build is attached;
          \`cargo build --release\` works there.
          TXT

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail

          # A draft release has no tag in git until someone publishes it, so
          # the tags endpoint cannot find it. Match on the name it will take.
          find_release_id() {
            local ids
            ids="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                     --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
            printf '%s' "${ids%%$'\n'*}"
          }

          id="$(find_release_id)"

          if [ -n "$id" ]; then
            # Re-running replaces what the draft holds rather than adding to
            # it, so the release is always exactly one build. gh's --clobber
            # cannot do this: for a draft it sees no existing assets at all,
            # and GitHub compares asset names case insensitively, so a file
            # whose name changed only in case is rejected as a duplicate
            # instead of being replaced.
            for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
                             --paginate --jq '.[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
          else
            # --target pins the tag to the commit that was actually built.
            # When the tag does not exist yet, this creates it, which is how a
            # release can be cut without anyone holding tag-push rights.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft --title "Mochi $TAG (preview)" --notes-file notes.md dist/*
            id="$(find_release_id)"
          fi

          # An upload that half succeeded leaves a release whose files do not
          # match its own checksums, and nothing above would have failed. Say
          # so here instead of letting a human find out by downloading.
          attached="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
                        --paginate --jq '.[].name' | sort)"
          expected="$(cd dist && ls -1 | sort)"
          if [ "$attached" != "$expected" ]; then
            echo "::error::the draft's assets do not match what was built" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$attached") || true
            exit 1
          fi
          printf '%s\n' "$attached"
