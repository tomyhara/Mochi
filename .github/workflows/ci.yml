name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # NFR-5.4: build and test on Windows and macOS. Linux is built too so that
  # contributors on Linux are not left guessing (Q-6: not supported, not excluded).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # mochi-desktop is a workspace member now, so building the workspace on
      # Linux needs the webview it links against. Windows and macOS use the
      # system one and need nothing.
      - name: Install Linux webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # mochi-desktop is a workspace member now, so building the workspace on
      # Linux needs the webview it links against. Windows and macOS use the
      # system one and need nothing.
      - name: Install Linux webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # NFR-4b.1b: every source file carries the Apache-2.0 header.
  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-license-headers.sh

  # NFR-4b.4 / R-12: golden files are derived from real sessions and live in a
  # public repository. Refuse anything that looks like a credential.
  golden-secrets:
    name: golden file secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-golden-secrets.sh

  # NFR-4b.2 (licence policy) and NFR-3.9 (vulnerability scan).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # Two suites: the interface itself, and the design mocks it is built against.
  # The mocks are a generated bundle, so a regeneration that drops an agreed
  # correction is exactly the kind of thing nobody notices by hand.
  ui:
    name: interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NFR-4b.2, the npm half of the licence policy.
      - name: Check npm licences
        run: ./scripts/check-npm-licenses.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The interface renders whatever `mochi export` produces. Regenerating the
  # fixture here proves the two still agree — otherwise the interface can drift
  # into rendering a contract the core no longer implements.
  ui-fixture:
    name: interface fixture is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate
        run: ./scripts/build-ui-fixture.sh

      - name: It should not have changed
        run: |
          if ! git diff --exit-code -- ui/src/fixtures/index.json; then
            echo "::error::ui/src/fixtures/index.json is stale — run ./scripts/build-ui-fixture.sh and commit it" >&2
            exit 1
          fi

  # NFR-3.1 / NFR-4b.8: Mochi must not contain code that talks to the network.
  # Resolves the graph per shipped target, so it needs cargo.
  no-network:
    name: no network dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-no-network-deps.sh
