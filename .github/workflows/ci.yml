name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # NFR-5.4: build and test on Windows and macOS. Linux is built too so that
  # contributors on Linux are not left guessing (Q-6: not supported, not excluded).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Nothing to install for the window: it draws its own widgets and
      # reaches the GPU through wgpu, which links against what the platform
      # already has. That is the whole point of the single-file build.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # NFR-4b.1b: every source file carries the Apache-2.0 header.
  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-license-headers.sh

  # NFR-4b.4 / R-12: golden files are derived from real sessions and live in a
  # public repository. Refuse anything that looks like a credential.
  golden-secrets:
    name: golden file secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-golden-secrets.sh

  # NFR-4b.2 (licence policy) and NFR-3.9 (vulnerability scan).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # The design mock the window is built against. It is a generated bundle, so
  # a regeneration that drops an agreed correction is exactly the kind of thing
  # nobody notices by hand. The window itself is tested in Rust, in the job
  # above.
  ui:
    name: design mock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NFR-4b.2, the npm half of the licence policy.
      - name: Check npm licences
        run: ./scripts/check-npm-licenses.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # NFR-3.1 / NFR-4b.8: Mochi must not contain code that talks to the network.
  # Resolves the graph per shipped target, so it needs cargo.
  no-network:
    name: no network dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-no-network-deps.sh
