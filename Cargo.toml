[workspace]
resolver = "2"
members = ["crates/mochi-core", "crates/mochi-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/tomyhara/Mochi"
authors = ["The Mochi Authors"]

[workspace.dependencies]
mochi-core = { path = "crates/mochi-core", version = "0.0.1" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
